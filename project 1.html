<!DOCTYPE html><html>
    <head>
        <title>students progress report</title>
    </head>
    <body>
        <h1>the students progress report</h1>
        <form>
            <fieldset>
                <legend>the student</legend><br>
                <label>name of student</label><br>
                <input type="text" id="name" placeholder="enter student name"><br><br>
                <label>student id</label><br>
                <input type="password" id="password" placeholder="enter student id"><br><br>
                <label>class and grade</label>
                <input type="text" id="class" placeholder="enter grade and section"><BR><BR>
            </fieldset><br>
            <fieldset>
                <legend>students marks</legend><br>
                <label>maths</label><br>
                <input type="text" id="marks maths" placeholder="marks out of 100"><br><br>
                <label>grade for maths</label><br>
                <select id="grades">
                    <option value="A+">A+</option>
                    <option value="B+">B+</option>
                    <option value="C+">C+</option>
                    <option value="fail">fail</option>
                </select><br><br>
                <label> science</label><br>
                <input type="text" id="marks science" placeholder="marks out of 100"><br><br>
                <label>grade for science</label><br>
                <select id="grades">
                    <option value="A+">A+</option>
                    <option value="B+">B+</option>
                    <option value="C+">C+</option>
                    <option value="fail">fail</option>
                </select><br><br>
                <label> english</label><br>
                <input type="text" id="marks english" placeholder="marks out of 100"><br><br>
                <label>grade for english</label><br>
                <select id="grades">
                    <option value="A+">A+</option>
                    <option value="B+">B+</option>
                    <option value="C+">C+</option>
                    <option value="fail">fail</option>
                </select><br><br>
            </fieldset><br>
            <fieldset>
                <legend>teachers notes</legend>
                <label>date of exam</label>
                <input type="date" id="date of exam" placeholder="date of exam"><br><br>
                <label>notes for student</label>
                <input type="text" id="notes" placeholder="notes for student if any">
            </fieldset><br>
            <input type="submit" placeholder="give to parent">
        </form>
    </body>
</html>
